<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Italian wine denominations explorer · WineVoyager API example</title>
    <meta name="description"
        content="Filter the 411 Italian DOCG and DOC wine denominations by region, province and colour. A zero-dependency example for the WineVoyager API.">
    <style>
        :root {
            --bg: #fffdf8;
            --panel: #f7f2e9;
            --line: #e0d4bf;
            --ink: #2a1f1a;
            --muted: #6f6258;
            --accent: #6d1526;
            --red: #8e1b2f;
            --white: #d8c36a;
            --rose: #e39aa6;
            --radius: 10px;
            color-scheme: light;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--ink);
            background: var(--bg);
        }

        header, main, footer { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        header { padding-top: 28px; }
        h1 { margin: 0 0 4px; font-size: 1.6rem; color: var(--accent); }
        header p { margin: 0; color: var(--muted); }

        /* ---------- filters ---------- */
        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 10px;
            margin: 20px 0 8px;
        }
        @media (max-width: 760px) { .filters { grid-template-columns: 1fr 1fr; } .filters .search { grid-column: 1 / -1; } }

        label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); }
        input, select {
            font: inherit;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: var(--ink);
        }
        input:focus-visible, select:focus-visible, button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .status { min-height: 1.5em; margin: 6px 0 14px; color: var(--muted); font-size: .9rem; }
        .status.error { color: var(--red); }

        /* ---------- cards ---------- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
            padding: 0;
            margin: 0;
            list-style: none;
        }
        .card {
            width: 100%;
            height: 100%;
            text-align: left;
            font: inherit;
            color: inherit;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .card:hover { border-color: var(--accent); }
        .card h2 { margin: 0; font-size: 1rem; line-height: 1.3; }
        .meta { font-size: .85rem; color: var(--muted); }
        .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        .badge {
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .04em;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--accent);
            color: var(--accent);
        }
        .badge.docg { background: var(--accent); color: #fff; }
        .badge.showcase { border-color: var(--line); color: var(--muted); font-weight: 600; }

        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.15); }
        .dot.red { background: var(--red); }
        .dot.white { background: var(--white); }
        .dot.rose { background: var(--rose); }

        /* ---------- detail dialog ---------- */
        dialog {
            width: min(640px, calc(100vw - 32px));
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 0;
            color: var(--ink);
            background: var(--bg);
        }
        dialog::backdrop { background: rgba(42, 31, 26, .45); }
        .dlg-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 16px 18px 0; }
        .dlg-head h2 { margin: 0; color: var(--accent); }
        .dlg-body { padding: 8px 18px 18px; }
        .close { font: inherit; font-size: 1.3rem; line-height: 1; background: none; border: 0; cursor: pointer; color: var(--muted); }
        h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
        .type { border-top: 1px solid var(--line); padding: 8px 0; }
        .type strong { display: block; }
        .type ul { margin: 4px 0 0; padding-left: 18px; }
        .note { background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; font-size: .9rem; }
        dl.source { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: .9rem; }
        dl.source dt { color: var(--muted); }
        dl.source dd { margin: 0; overflow-wrap: anywhere; }
        a { color: var(--accent); }

        footer { margin-top: 32px; padding-bottom: 28px; font-size: .85rem; color: var(--muted); }
    </style>
</head>

<body>
    <header>
        <h1>Italian wine denominations</h1>
        <p>All Italian DOCG and DOC wines, straight from the official regulations. Built on the
            <a href="https://api.winevoyager.tours/docs">WineVoyager API</a>, no key needed.</p>
    </header>

    <main>
        <form class="filters" id="filters" role="search" onsubmit="return false">
            <label class="search">Name
                <input id="f-name" type="search" placeholder="e.g. barolo, chianti, prosecco" autocomplete="off">
            </label>
            <label>Region
                <select id="f-region"><option value="">All regions</option></select>
            </label>
            <label>Province
                <select id="f-province"><option value="">All provinces</option></select>
            </label>
            <label>Colour
                <select id="f-color">
                    <option value="">Any colour</option>
                    <option value="red">Red</option>
                    <option value="white">White</option>
                    <option value="rose">Rosé</option>
                </select>
            </label>
            <label>Class
                <select id="f-class">
                    <option value="">DOCG + DOC</option>
                    <option value="DOCG">DOCG only</option>
                    <option value="DOC">DOC only</option>
                </select>
            </label>
        </form>

        <p class="status" id="status" aria-live="polite">Loading…</p>
        <ul class="grid" id="grid"></ul>
    </main>

    <dialog id="detail" aria-labelledby="dlg-title">
        <div class="dlg-head">
            <h2 id="dlg-title"></h2>
            <button class="close" type="button" aria-label="Close" onclick="this.closest('dialog').close()">×</button>
        </div>
        <div class="dlg-body" id="dlg-body"></div>
    </dialog>

    <footer>
        Data by <a href="https://www.winevoyager.tours/developers">WineVoyager</a>
        (<a href="https://creativecommons.org/licenses/by/4.0/">CC-BY 4.0</a>), from the MASAF disciplinari and the EU
        eAmbrosia register. Reference data, not legal advice.
        · <a href="https://github.com/sariodesign/winevoyager-examples">Source code</a>
    </footer>

    <script>
        // ---------------------------------------------------------------------
        // WineVoyager Explorer: a zero-dependency example for the WineVoyager API.
        //
        // Basic level only: no API key. Never put a `full` key in a web page,
        // anyone can read it here. Keep keys on a server.
        // ---------------------------------------------------------------------

        const API = 'https://api.winevoyager.tours';

        // State: everything is loaded once, then filtered in the browser.
        // GET /v1/denominations returns the whole list in one call (no paging),
        // so a search box doesn't need one request per keystroke (the Basic
        // rate limit is 30 requests/minute per IP).
        let denominations = [];
        let provinceToRegion = new Map();

        const $ = (id) => document.getElementById(id);

        // Small DOM helper: builds elements with textContent only, never
        // innerHTML, so data from the API is always treated as text.
        function el(tag, props = {}, ...children) {
            const node = document.createElement(tag);
            for (const [key, value] of Object.entries(props)) {
                if (key === 'class') node.className = value;
                else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
                else node.setAttribute(key, value);
            }
            for (const child of children.flat()) {
                if (child == null || child === false) continue;
                node.append(child instanceof Node ? child : document.createTextNode(String(child)));
            }
            return node;
        }

        // fetch + JSON, with a readable error for the rate limit.
        async function getJSON(path) {
            const res = await fetch(API + path);
            if (res.status === 429) throw new Error('Rate limit reached (30 requests/minute). Wait a moment and retry.');
            if (!res.ok) throw new Error(`HTTP ${res.status} on ${path}`);
            return res.json();
        }

        // Lowercase, no accents: "rosé" matches "rose", "Valdôtain" matches "valdotain".
        const normalize = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

        // ---------- load ----------
        async function init() {
            try {
                const [regionsRes, listRes] = await Promise.all([
                    getJSON('/v1/regions'),
                    getJSON('/v1/denominations'),
                ]);

                denominations = listRes.denominations
                    .map((d) => ({ ...d, _search: normalize(d.name) }))
                    .sort((a, b) => a.name.localeCompare(b.name, 'it'));

                for (const region of regionsRes.regions) {
                    $('f-region').append(el('option', { value: region.name }, `${region.name} (${region.count})`));
                    for (const p of region.provinces) provinceToRegion.set(p, region.name);
                }
                fillProvinces();
                render();
            } catch (err) {
                showError(err);
            }
        }

        // Province list follows the selected region.
        function fillProvinces() {
            const region = $('f-region').value;
            const select = $('f-province');
            const provinces = [...provinceToRegion]
                .filter(([, r]) => !region || r === region)
                .map(([p]) => p)
                .sort((a, b) => a.localeCompare(b, 'it'));
            select.replaceChildren(el('option', { value: '' }, 'All provinces'),
                ...provinces.map((p) => el('option', { value: p }, p)));
        }

        // ---------- filter ----------
        function matches(d, f) {
            if (f.name && !d._search.includes(f.name)) return false;
            if (f.region && !d.regions.includes(f.region)) return false;
            if (f.color && !d.colors.includes(f.color)) return false;
            if (f.cls && d.classification !== f.cls) return false;
            if (f.province) {
                // Same rule as the API's ?province= filter: a denomination whose
                // area is a whole region has no provinces of its own, and it is
                // included for every province of that region.
                const regionWide = d.provinces.length === 0 && d.regions.includes(provinceToRegion.get(f.province));
                if (!d.provinces.includes(f.province) && !regionWide) return false;
            }
            return true;
        }

        function render() {
            const f = {
                name: normalize($('f-name').value.trim()),
                region: $('f-region').value,
                province: $('f-province').value,
                color: $('f-color').value,
                cls: $('f-class').value,
            };
            const shown = denominations.filter((d) => matches(d, f));

            $('status').classList.remove('error');
            $('status').textContent = `${shown.length} of ${denominations.length} denominations`;
            $('grid').replaceChildren(...shown.map(card));
        }

        function card(d) {
            return el('li', {},
                el('button', { class: 'card', type: 'button', onclick: () => openDetail(d.id) },
                    el('div', { class: 'row' },
                        el('span', { class: `badge ${d.classification.toLowerCase()}` }, d.classification),
                        // At the Basic level, `types` is present only for the showcase denominations.
                        d.types && el('span', { class: 'badge showcase', title: 'Full record available without a key' }, 'full record'),
                    ),
                    el('h2', {}, d.name),
                    el('div', { class: 'meta' }, d.regions.join(', ')),
                    d.provinces.length > 0 && el('div', { class: 'meta' }, shorten(d.provinces, 4)),
                    el('div', { class: 'row meta' },
                        d.colors.map((c) => el('span', { class: `dot ${c}`, title: c, 'aria-label': c })),
                        d.recognition_year && `· since ${d.recognition_year}`,
                    ),
                ),
            );
        }

        const shorten = (list, n) => list.length <= n ? list.join(', ') : `${list.slice(0, n).join(', ')} +${list.length - n}`;

        // ---------- detail ----------
        async function openDetail(id) {
            const dialog = $('detail');
            $('dlg-title').textContent = '…';
            $('dlg-body').replaceChildren(el('p', { class: 'meta' }, 'Loading…'));
            dialog.showModal();
            try {
                // One request per opened record, to show the single-record endpoint.
                const d = await getJSON(`/v1/denominations/${encodeURIComponent(id)}`);
                $('dlg-title').textContent = d.name;
                $('dlg-body').replaceChildren(...detailBody(d));
            } catch (err) {
                $('dlg-body').replaceChildren(el('p', { class: 'status error' }, err.message));
            }
        }

        function detailBody(d) {
            const parts = [
                el('div', { class: 'row' },
                    el('span', { class: `badge ${d.classification.toLowerCase()}` }, d.classification),
                    el('span', { class: 'meta' }, `${d.regions.join(', ')}${d.provinces.length ? ' · ' + d.provinces.join(', ') : ''}`),
                ),
            ];

            parts.push(el('h3', {}, 'Wine types and grapes'));
            if (d.types && d.types.length) {
                for (const t of d.types) {
                    parts.push(el('div', { class: 'type' },
                        el('strong', {}, t.name),
                        t.methods && el('span', { class: 'meta' }, t.methods.join(', ')),
                        t.grapes && el('ul', {}, t.grapes.map((g) => el('li', {}, grapeText(g)))),
                    ));
                }
            } else {
                // access_level tells you what you got: `basic` without a key.
                parts.push(el('p', { class: 'note' },
                    'Wine types and grapes for this denomination are part of the full record, which needs a Full key. ',
                    'This public demo uses the Basic level only; open one of the 8 records marked "full record" to see them.'));
            }

            const s = d.source || {};
            parts.push(el('h3', {}, 'Official source'));
            parts.push(el('dl', { class: 'source' },
                s.eambrosia_url && [el('dt', {}, 'EU register'), el('dd', {}, el('a', { href: s.eambrosia_url, target: '_blank', rel: 'noopener' }, `eAmbrosia · ${d.ea_code}`))],
                s.disciplinare_file && [el('dt', {}, 'Disciplinare'), el('dd', {},
                    s.disciplinare_url ? el('a', { href: s.disciplinare_url, target: '_blank', rel: 'noopener' }, s.disciplinare_file) : s.disciplinare_file,
                    s.disciplinare_archive ? ` (MASAF archive “${s.disciplinare_archive}”)` : '')],
                s.text_updated_to && [el('dt', {}, 'Text updated to'), el('dd', {}, s.text_updated_to)],
                d.recognition_year && [el('dt', {}, 'Recognised'), el('dd', {}, d.recognition_year)],
                [el('dt', {}, 'Access level'), el('dd', {}, d.access_level)],
            ));
            return parts;
        }

        // A grape is either { name, min?, max? } or { any_of: [...], min?, max? },
        // where the limit applies to the group as a whole.
        function grapeText(g) {
            const label = g.any_of ? g.any_of.join(' or ') : g.name;
            let range = '';
            if (g.min != null && g.max != null) range = ` ${g.min}–${g.max}%`;
            else if (g.min != null) range = ` ≥ ${g.min}%`;
            else if (g.max != null) range = ` ≤ ${g.max}%`;
            return label + range;
        }

        function showError(err) {
            $('status').classList.add('error');
            $('status').textContent = err.message;
        }

        // ---------- events ----------
        let timer;
        $('f-name').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 150); });
        $('f-region').addEventListener('change', () => { fillProvinces(); render(); });
        for (const id of ['f-province', 'f-color', 'f-class']) $(id).addEventListener('change', render);
        $('detail').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });

        init();
    </script>
</body>

</html>
